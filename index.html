<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RustikViewing</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23c45c26'/%3E%3Ctext x='32' y='44' font-size='28' text-anchor='middle' fill='%23fff' font-family='sans-serif' font-weight='700'%3EV%3C/text%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;min-height:100vh;background:#1a1410;color:#e8d5c0;display:flex;flex-direction:column}
.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:rgba(40,30,24,.95);border-bottom:1px solid rgba(196,92,38,.3)}
.logo{font-weight:700;font-size:1.1rem;color:#e07a3a;white-space:nowrap}
.bar{flex:1;display:flex;gap:8px;align-items:center;max-width:900px}
.bar input{flex:1;padding:10px 14px;border-radius:999px;border:1px solid rgba(196,92,38,.35);background:#2a211c;color:#e8d5c0;font-size:.95rem;outline:none}
.bar button,.btn{padding:10px 16px;border-radius:999px;border:1px solid rgba(196,92,38,.4);background:linear-gradient(135deg,#d4692a,#9c3f12);color:#fff;font-weight:600;cursor:pointer;font-size:.85rem}
.bar button.ghost{background:#2a211c;color:#e8d5c0}
.bar select{padding:8px 10px;border-radius:999px;border:1px solid rgba(196,92,38,.35);background:#2a211c;color:#e8d5c0;font-size:.8rem}
.main{flex:1;display:flex;flex-direction:column}
#frame{flex:1;width:100%;border:none;background:#0d0a08;display:none}
#frame.show{display:block}
.landing{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
.landing h1{font-size:2.4rem;margin-bottom:8px;background:linear-gradient(135deg,#e07a3a,#c45c26);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.landing p{color:#b89b7a;margin-bottom:28px;max-width:440px;line-height:1.5}
.search{width:100%;max-width:520px;display:flex;gap:10px;margin-bottom:28px}
.search input{flex:1;padding:14px 18px;border-radius:999px;border:1.5px solid rgba(196,92,38,.4);background:#2a211c;color:#e8d5c0;font-size:1.05rem;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:520px}
.chips button{padding:8px 14px;border-radius:999px;border:1px solid rgba(196,92,38,.25);background:#2a211c;color:#e8d5c0;cursor:pointer;font-size:.8rem}
.chips button:hover{border-color:#c45c26}
.status{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:rgba(40,30,24,.95);border:1px solid rgba(196,92,38,.3);border-radius:999px;padding:8px 16px;font-size:.78rem;color:#b89b7a;z-index:20;max-width:90vw}
.status.ok{color:#6abf4b}
.status.err{color:#e07a3a}
</style>
</head>
<body>
<div class="top">
  <div class="logo">RustikViewing</div>
  <div class="bar">
    <input id="urlBar" type="text" placeholder="https://example.com or search…" onkeydown="if(event.key==='Enter')go()">
    <button onclick="go()">Go</button>
    <button class="ghost" onclick="home()">Home</button>
    <select id="wispSelect" title="Wisp server"></select>
  </div>
</div>
<div class="main">
  <div class="landing" id="landing">
    <h1>RustikViewing</h1>
    <p>Self-hosted Scramjet proxy. Service worker + Wisp transport — your own gateway, not a random proxy homepage.</p>
    <div class="search">
      <input id="mainSearch" type="text" placeholder="Enter URL or search" onkeydown="if(event.key==='Enter')go(true)">
      <button class="btn" onclick="go(true)">Open</button>
    </div>
    <div class="chips">
      <button onclick="openProxied('https://www.google.com/')">Google</button>
      <button onclick="openProxied('https://www.youtube.com/')">YouTube</button>
      <button onclick="openProxied('https://discord.com/app')">Discord</button>
      <button onclick="openProxied('https://hl2.slqnt.dev/')">HL2 Port</button>
      <button onclick="openProxied('https://poki.com/en/g/retro-bowl')">Retro Bowl</button>
      <button onclick="openProxied('https://now.gg/apps/roblox-corporation/5349/roblox.html')">Roblox</button>
    </div>
  </div>
  <iframe id="frame" title="Proxied"></iframe>
</div>
<div class="status" id="status">initializing proxy…</div>
<script src="engine.js"></script>
</body>
</html>
